[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-assistant"
version = "0.1.0"
description = "Local speech transcription and live meeting summaries"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1",
  "numpy>=1.26,<2", "scipy>=1.13,<2", "sounddevice>=0.5,<1",
  "soundcard>=0.4.5,<1", "faster-whisper>=1.1,<2", "platformdirs>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]
desktop-build = ["pyinstaller>=6.14,<7"]

[tool.setuptools.packages.find]
include = ["meeting_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
